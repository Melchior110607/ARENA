# Arena prototype — two containers, fictional data, no database.
#
#   docker compose up --build   →   http://localhost:3100
#
# Ports 3000/3001 and 8000/8001 are in use by other projects on this machine, so the
# prototype publishes on 3100 and 8100 instead.

services:
  backend:
    build: ./backend
    container_name: arena-backend
    ports:
      - "8100:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    container_name: arena-frontend
    ports:
      - "3100:3000"
    environment:
      # Read at request time — both server components and the /api-proxy rewrite
      # (next.config.ts) reach the backend over the compose network this way.
      # The browser never calls the backend directly, so no public URL needs to
      # be baked into the client bundle and no CORS configuration is needed.
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
